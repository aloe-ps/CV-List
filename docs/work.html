<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>作品詳細 | CV-LIST</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%236750a4' d='M4 5h16v14H4z'/%3E%3C/svg%3E" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=6" />
</head>
<body class="detail-page">

  <header class="app-bar" id="app-bar" data-role="app-bar">
    <button class="icon-btn" onclick="window.location.href='index.html'" aria-label="一覧に戻る">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <div class="app-bar__title-area">
      <div class="app-bar__headline" id="bar-title">作品詳細</div>
    </div>
    <div class="app-bar__actions">
      <button class="icon-btn" data-theme-toggle aria-label="テーマ切り替え">
        <span class="material-symbols-outlined" data-theme-icon>dark_mode</span>
      </button>
    </div>
  </header>

  <main class="container container--narrow">
    <div class="detail" id="detail">
      <div class="empty">
        <span class="material-symbols-outlined">download</span>
        <span class="type-title-small">データを読み込み中…</span>
      </div>
    </div>
  </main>

  <footer class="footer container">
    <p>作品データの修正・追加は <a href="generator.html">JSONジェネレーター</a> と GitHub Pull Request で行えます。</p>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="assets/js/config.js?v=2"></script>
  <script src="assets/js/works.js?v=4"></script>
  <script src="assets/js/theme.js?v=2"></script>
  <script src="assets/js/work.js?v=2"></script>
</body>
</html>
