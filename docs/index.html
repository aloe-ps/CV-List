<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PENSPINNING-FILMS-LIST | 作品一覧</title>
  <meta name="description" content="CV,SV,PVアーカイブ。作者・出演者・使用楽曲・コミュニティから検索できます。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%236750a4' d='M4 5h16v14H4z'/%3E%3C/svg%3E" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=6" />
</head>
<body>

  <header class="app-bar" id="app-bar" data-role="app-bar">
    <div class="app-bar__title-area">
      <div class="app-bar__title">PENSPINNING-FILMS-LIST</div>
      <div class="app-bar__subtitle hide-sm">CV,SV,PVアーカイブ</div>
    </div>
    <div class="app-bar__actions">
      <button class="icon-btn" data-theme-toggle aria-label="テーマ切り替え">
        <span class="material-symbols-outlined" data-theme-icon>dark_mode</span>
      </button>
    </div>
  </header>

  <main class="container">

    <section class="hero">
      <h1 class="hero__title">登録されている作品</h1>
      <p class="hero__lead">
        作者・出演者・使用楽曲・コミュニティから作品をさがせます。作品をクリックすると詳細を確認できます。
      </p>
    </section>

    <section class="info-card" aria-label="作品を追加する">
      <div class="info-card__icon">
        <span class="material-symbols-outlined">library_add</span>
      </div>
      <div class="info-card__body">
        <span class="type-title-small">作品を追加したいですか？</span>
        <p>サイト内のジェネレーターで JSON を生成し、GitHub の Pull Request で作品概要を追加できます。</p>
      </div>
      <div class="info-card__actions">
        <a class="btn btn--filled" href="generator.html">
          <span class="material-symbols-outlined">add</span>
          作品を追加
        </a>
      </div>
    </section>

    <div class="toolbar">
      <div class="toolbar__search">
        <span class="material-symbols-outlined" aria-hidden="true">search</span>
        <input type="search" id="search-input" placeholder="タイトル・作者・楽曲・出演者で検索" autocomplete="off" />
      </div>
      <div class="toolbar__sort">
        <span class="hide-sm">並び順</span>
        <span class="select">
          <select id="sort-select" aria-label="並び順">
            <option value="date">新しい順</option>
            <option value="author">作者順</option>
            <option value="performer">出演者順</option>
            <option value="community">コミュニティ順</option>
          </select>
        </span>
      </div>
      <div class="toolbar__genres">
        <span class="segment" role="group" aria-label="ジャンルで絞り込み">
          <button class="segment__btn is-active" type="button" data-genre="">すべて</button>
          <button class="segment__btn" type="button" data-genre="CV">CV</button>
          <button class="segment__btn" type="button" data-genre="SV">SV</button>
          <button class="segment__btn" type="button" data-genre="PV">PV</button>
        </span>
      </div>
      <div class="toolbar__count" id="result-count" role="status"></div>
    </div>

    <div id="list" aria-live="polite"></div>

  </main>

  <footer class="footer container">
    <p>作品データは <span class="material-symbols-outlined">data_object</span> <code>docs/data/works.json</code> で管理されています。</p>
  </footer>

  <script src="assets/js/config.js?v=2"></script>
  <script src="assets/js/works.js?v=3"></script>
  <script src="assets/js/theme.js?v=2"></script>
  <script src="assets/js/app.js?v=2"></script>
</body>
</html>
