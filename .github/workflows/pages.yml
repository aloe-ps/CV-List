# master への push 時に自動ビルド＋GitHub Pages へデプロイする。
# PR (master / Develop 向け) では検証のみ行い、デプロイはしない。
# 公開方式を GitHub Actions に切り替える際は、リポジトリの
# Settings > Pages > Build and deployment > Source で "GitHub Actions" を選択すること。

name: Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, Develop]
  workflow_dispatch:

permissions:
  contents: read

# デプロイの競合を避けるため Pages 関連の実行を直列化する。
# 実行中のデプロイはキャンセルしない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: |
          set -eu
          test -f dist/index.html
          test -f dist/work.html
          test -f dist/generator.html
          test -f dist/data/works.json
          test -f dist/assets/css/style.css
          test "$(ls dist/assets/*.js | wc -l)" -ge 1
          for page in index work generator; do
            refs=$(grep -oE '(src|href)="[^"]+"' "dist/${page}.html" \
              | sed -E 's/^(src|href)="([^"?#]+).*/\2/' \
              | grep -vE '^(https?:|data:|#)' || true)
            for ref in $refs; do
              if [ ! -f "dist/${ref}" ]; then
                echo "missing asset: ${page}.html -> ${ref}"
                exit 1
              fi
            done
          done
          echo "build output OK"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    # 本番デプロイは master への push 時のみ。PR 由来では実行されない。
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
